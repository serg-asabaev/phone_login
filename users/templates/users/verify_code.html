{% extends 'users/base.html' %}

{% block title %}Подтверждение кода{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card p-4">
        <div class="card-body">
            <h3 class="text-center mb-4">🔐 Введите код</h3>
            <p class="text-muted text-center">
                Код отправлен на номер <strong>{{ phone }}</strong>
            </p>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="{{ form.code.id_for_label }}" class="form-label">
                        Код из SMS
                    </label>
                    {{ form.code }}
                    {% if form.code.errors %}
                        <div class="text-danger small mt-1">{{ form.code.errors.0 }}</div>
                    {% endif %}
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Подтвердить
                </button>
                
                <div class="text-center">
                    <a href="{% url 'users:phone_input' %}" class="text-muted small">
                        ← Изменить номер телефона
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
